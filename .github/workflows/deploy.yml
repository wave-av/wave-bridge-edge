name: deploy

# Auto-deploy on push to main. Uses `deploy --name wave-bridge-edge` (NOT `--env`) to avoid the
# wrangler env-fork bug: with a single-env wrangler.toml, `deploy --env <x>` appends <x> to the worker
# name and forks a second worker. An explicit --name is fork-proof. (Same fix as wave-mux-engine.)
# ubuntu-latest has Docker, which wrangler uses to build the CF Container image
# declared in wrangler.toml [[containers]] (containers/moq/Dockerfile) — the image is NEVER built
# locally on a Mac; CI is the container build host.
#
# This workflow file is OUTSIDE the `paths` filter below, so editing it does NOT trigger a deploy.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "containers/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: deploy-wave-bridge-edge
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@wave-av"
      - name: install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Belt-and-suspenders against a stale/orphaned run: refuses to deploy a commit that is
      # not (or no longer) an ancestor of origin/main. fetch-depth: 0 above gives this full history.
      - name: deploy guard — commit must be reachable from origin/main
        run: |
          set -e
          git fetch origin main --quiet
          TIP=$(git rev-parse origin/main)
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not an ancestor of origin/main (tip $TIP) — a newer commit has superseded this run; refusing to deploy a stale/orphaned commit"
            exit 1
          fi
          echo "deploy guard OK: $GITHUB_SHA is an ancestor of origin/main (tip $TIP)"


      - name: token gate
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN unset — skipping CD"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: deploy worker + container
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --name wave-bridge-edge --var GIT_SHA:${{ github.sha }}

      # Proven-live gate (proven-live-or-not-done): a green `wrangler deploy` only proves the API
      # call succeeded, not that the right bundle is answering live traffic. This step is the
      # receipt.
      #
      # Absence must never read as a pass (measured on wave-email-edge deploy run 33994760933,
      # 2026-09-05: resolve-deploy-host.mjs didn't understand a TOML shape it doesn't parse, so it
      # printed nothing for a PRODUCTION deploy with a perfectly live route, and this step quietly
      # exited 0 — the worker was live and correct, but the gate proved nothing).
      #
      # CORRECTED 2026-09-05 (this workflow briefly shipped a two-state fix that over-collapsed: it
      # hard-failed ANY empty resolver output for production, which conflates "a route is declared
      # but didn't resolve" — the real defect — with "no route declared at all", a legitimate skip
      # elsewhere in the fleet, caught by gitar-bot on wave-vision-ingest#15). resolve-deploy-host.mjs
      # now emits a FOUR-state exit code (see its header comment for the full contract) and this step
      # branches on the exit code, not on env name or emptiness:
      #   exit 0 = resolved — verify it below.
      #   exit 1 = a route IS declared for this env but did not resolve — FAIL (resolver/toml regression).
      #   exit 2 = nothing declared for this env — SKIP (this repo's TARGET_ENV is always literal
      #            `production`, which has a top-level route today, so this branch is not expected
      #            to fire in practice here, but the contract is honored regardless of TARGET_ENV).
      #   else   = resolver crashed (exit 3) or an unexpected code — FAIL rather than fall through
      #            to verification with a possibly-empty host.
      - name: post-deploy verify — proven live, not merely deployed
        if: steps.gate.outputs.deploy == 'true'
        env:
          TARGET_ENV: production
          EXPECT_SHA: ${{ github.sha }}
        run: |
          set -e
          # Capture the real exit code (NOT `|| true`, which discards it and is exactly what let
          # the two-state bug ship) so the four states above can be told apart.
          set +e
          HOST=$(node scripts/ci/resolve-deploy-host.mjs "$TARGET_ENV")
          RC=$?
          set -e
          if [ "$RC" = "1" ]; then
            echo "::error::a route IS declared in wrangler.toml but resolve-deploy-host.mjs could not resolve it for env '$TARGET_ENV' after a live deploy — refusing to silently skip the proven-live gate. This means the resolver regressed or wrangler.toml's route/routes shape changed in a way it doesn't recognise (the wave-email-edge run 33994760933 defect class). A deploy with a declared-but-unverifiable route is a FAILURE, not a pass."
            exit 1
          fi
          if [ "$RC" = "2" ]; then
            echo "::notice::no route declared anywhere in wrangler.toml for env '$TARGET_ENV' — skipping live verification"
            exit 0
          fi
          if [ "$RC" != "0" ]; then
            echo "::error::resolve-deploy-host.mjs exited with unexpected code $RC for env '$TARGET_ENV' (expected 0, 1, or 2) — treating as a failure rather than falling through to verification with a possibly-empty host. This usually means the resolver itself crashed (exit 3 — a parser bug, a permissions error, etc.); see the resolver's own stderr in the job log above."
            exit 1
          fi

          echo "Verifying https://$HOST/health reports sha == $EXPECT_SHA (timeout 120s)..."
          DEADLINE=$((SECONDS + 120))
          LIVE_SHA=""
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            LIVE_SHA=$(curl -fsS --max-time 10 "https://$HOST/health" 2>/dev/null \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(d).sha||"")}catch{process.stdout.write("")}})' \
              || echo "")
            if [ "$LIVE_SHA" = "$EXPECT_SHA" ]; then
              echo "receipt: https://$HOST/health sha=$LIVE_SHA matches $EXPECT_SHA"
              break
            fi
            sleep 5
          done
          if [ "$LIVE_SHA" != "$EXPECT_SHA" ]; then
            echo "::error::post-deploy verification FAILED after 120s — https://$HOST/health reports sha='$LIVE_SHA', expected '$EXPECT_SHA'. A stale or wrong bundle may be live."
            exit 1
          fi
