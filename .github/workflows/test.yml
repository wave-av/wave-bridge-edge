name: test

# Per-PR unit-test gate (vitest, Cloudflare Workers pool). Mirrors typecheck.yml's
# checkout/setup-node/npm-ci pattern + GitHub Packages auth used across this repo's workflows.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
      - name: install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: test
        run: npm test
      - name: test (scripts/ci/*.test.mjs — node:test, NOT globbed by vitest's test/**/*.spec.ts include)
        # vitest.config.ts scopes `include` to `test/**/*.spec.ts` only, so a node:test-based suite
        # living under scripts/ci/ (e.g. resolve-deploy-host.test.mjs) is invisible to `npm test`
        # above and would otherwise never run in ANY CI job — the same "test exists but no job
        # executes it" gap flagged in wave-docs-www's test:gen glob. This step is the fix: run it
        # explicitly via node's own test runner.
        run: npm run test:ci-scripts
