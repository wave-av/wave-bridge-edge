# image-content-gate — assert what this repo's container images actually SHIP.
#
# Calls the fleet's reusable gate (wave-av/wave-foundation#1324). Why it exists here: a 2026-08-31
# audit of all 174 wave-av repos found wave-ndi-edge was the ONLY repo with any CI assertion about
# image CONTENT — every other publish lane, this one included, was ungated. The shared
# wave-sec-gate.yml scans the git TREE, never a built image, and is advisory in every caller, so a
# licensed binary present only in an image LAYER is invisible to every gate we run.
# Tracking: wave-av/wave-foundation#1321.
#
# SCOPE — the NDI container only, deliberately.
#   * containers/ndi fetches the NDI runtime at RUN time and must never bake it. That is a
#     path-shaped claim, which is exactly what this gate decides.
#   * containers/ffmpeg is NOT gated here. Its risk was never a path — it was the build FLAG
#     (--enable-nonfree, now removed), and that is asserted inside its own Dockerfile against the
#     built binary's buildconf. Putting it there rather than in CI is deliberate: it then runs in
#     the lane that actually PUSHES, and a ~30-minute FFmpeg source build does not run per-PR.
#
# The `uses:` is SHA-pinned per pin-actions-by-sha. wave-foundation is PRIVATE and this repo is
# PUBLIC; that combination works because the callee is set to access_level=organization — the same
# path issue-ops-triage.yml already uses. NOTE: if that access is ever revoked the run dies at
# STARTUP, which produces no jobs, no logs, and NO CHECK ON THE PR AT ALL — it does not fail loudly,
# it vanishes. Check for its absence, not for its failure.

name: image-content-gate

on:
  pull_request:
    paths:
      - 'containers/ndi/**'
      - '.github/workflows/image-content-gate.yml'
  push:
    branches: [main]
    paths:
      - 'containers/ndi/**'
      - '.github/workflows/image-content-gate.yml'
  workflow_dispatch:

permissions: {}

jobs:
  ndi:
    name: containers/ndi ships no NDI runtime
    uses: wave-av/wave-foundation/.github/workflows/image-content-gate.yml@0319019537b01a6e487e813c8536ff4baf64b265
    with:
      context: containers/ndi
      image: wave-ndi-bridge:ci
      # The NDI runtime and tool binaries. Vizrt-licensed; baking one into a pushed layer is
      # redistribution we hold no position for. Reference: wave-av/wave-ndi-edge
      # containers/ndi/LICENSING.md.
      forbid: 'libndi|ndi-discovery-server|ndi-record|ndi-embedded-bridge|ndi-benchmark'
      # Positive control: COPY'd by containers/ndi/Dockerfile. If this is absent the listing is not
      # trustworthy and the gate exits 2 rather than reporting a clean zero.
      control-path: usr/local/bin/entrypoint.sh
      reason: 'wave-av/wave-ndi-edge containers/ndi/LICENSING.md'
